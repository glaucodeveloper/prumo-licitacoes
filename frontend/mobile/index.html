<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7f5" />
    <title>Prumo Licitações</title>
  </head>
  <body>
    <main class="connect-shell">
      <section class="connect-card" aria-labelledby="app-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 22V6h8a5 5 0 1 1 0 10H9"/><path d="m19 22-6-6"/><path d="M21 5v4"/></svg></span>
          <span><strong>prumo</strong><small>LICITAÇÕES &amp; OBRAS</small></span>
        </div>
        <div class="intro">
          <span class="eyebrow">ACESSO PROTEGIDO</span>
          <h1 id="app-title">Conectar ao Prumo</h1>
          <p>Use a chave de acesso do roteador para abrir o workspace neste aparelho.</p>
        </div>
        <form id="connect-form" novalidate>
          <label for="router-key">Chave de acesso</label>
          <div class="key-field">
            <input id="router-key" name="router-key" type="password" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Cole somente a chave" />
            <button class="reveal-key" id="reveal-key" type="button" aria-label="Mostrar chave">Mostrar</button>
          </div>
          <p class="privacy-note">A chave fica no armazenamento privado do app. O endereço e os serviços já vêm configurados.</p>
          <button class="primary-button" type="submit" id="connect-button">Abrir Prumo</button>
          <button class="secondary-button" type="button" id="change-key" hidden>Trocar chave salva</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <footer>Conexão segura · requer internet</footer>
    </main>
    <script type="module" src="/src/mobile.ts"></script>
  </body>
</html>
